[package]
name = "virtual-voice"
version = "1.6.0"
description = "Virtual Voice Client"
authors = ["you"]
edition = "2021"

[lib]
name = "virtual_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
cpal = "0.15"
chrono = "0.4"
zip = "2"
ureq = { version = "2", features = ["json"] }

# Global hotkeys rely on platform backends that pull GTK on Linux; this app
# targets Windows, so keep the plugin Windows-only. TTS API keys live in the
# Windows Credential Manager via keyring.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-global-shortcut = "=2.3.2"
